services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tgstore
      POSTGRES_PASSWORD: tgstore
      POSTGRES_DB: tgstore
    ports:
      - "5434:5432"
    volumes:
      - tgstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgstore"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tgstore_pgdata:
  redis_data:
